name: Redirect old GitHub Pages link

# Сайт переехал на Cloudflare: там работают ИИ-чат и заявки, а на GitHub Pages — нет.
# Старую ссылку dimashparaga123321-tech.github.io/dimas/ люди уже получили,
# поэтому здесь публикуется только страница, которая перекидывает на новый адрес.
# Сам сайт выкладывается на Cloudflare командой deploy.cmd.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/github-pages-redirect.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
